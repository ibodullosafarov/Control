name: ControlApp
options:
  bundleIdPrefix: com.control
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  defaultConfig: Debug

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  ControlApp:
    type: application
    platform: iOS
    sources:
      - ControlApp
    info:
      path: ControlApp/Info.plist
      properties:
        CFBundleDisplayName: Control
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.control.studyapp.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
    entitlements:
      path: ControlApp/ControlApp.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.control.studyapp.ios
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)com.control.studyapp.ios

  ControlWidget:
    type: app-extension
    platform: iOS
    sources:
      - ControlWidget
    info:
      path: ControlWidget/Info.plist
      properties:
        CFBundleDisplayName: Control Widget
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ControlWidgetBundle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.control.studyapp.ios.ControlWidget
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic

  ControlActivityExtension:
    type: app-extension
    platform: iOS
    sources:
      - ControlActivityExtension
    info:
      path: ControlActivityExtension/Info.plist
      properties:
        CFBundleDisplayName: Control Live Activity
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.control.studyapp.ios.ControlActivityExtension
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic

  ControlShieldConfigurationExtension:
    type: app-extension
    platform: iOS
    sources:
      - ControlShieldConfigurationExtension
    info:
      path: ControlShieldConfigurationExtension/Info.plist
      properties:
        CFBundleDisplayName: Control Shield Config
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettingsUI.shield-configuration-service
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.control.studyapp.ios.ControlShieldConfigurationExtension
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic

  ControlShieldActionExtension:
    type: app-extension
    platform: iOS
    sources:
      - ControlShieldActionExtension
    info:
      path: ControlShieldActionExtension/Info.plist
      properties:
        CFBundleDisplayName: Control Shield Action
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettings.shield-action-service
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.control.studyapp.ios.ControlShieldActionExtension
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
